# MausOS · Hyprland layer
# Sourced from ~/.config/hypr/hyprland.conf. Edit freely; the installer does
# not overwrite this file once it exists.
#
# Window placement for the shell is done by `maus-shell-open` through
# `hyprctl dispatch` (it works on every Hyprland version, unlike window-rule
# syntax which changed in 0.53). This file only holds env, binds and autostart.

# Accessibility trees on for every toolkit (rung 3 of the control ladder).
env = MAUSOS, 1
env = GTK_MODULES, gail:atk-bridge
env = QT_LINUX_ACCESSIBILITY_ALWAYS_ON, 1
env = GNOME_ACCESSIBILITY, 1
env = ACCESSIBILITY_ENABLED, 1

# Super+A: toggle the MausOS shell (it lives on the special workspace "maus").
bind = SUPER, A, exec, maus-shell-toggle

# Super+Shift+Escape: interrupt. Stops every agent turn, releases every window
# lease, kills any virtual input. Bound in the compositor so it works even if
# the shell is wedged.
bind = SUPER SHIFT, ESCAPE, exec, maus-agent-stop --all

# Super+Shift+A: a screenshot of the focused window into the clipboard for
# "look at this" moments (rung 5, labelled as such).
bind = SUPER SHIFT, A, exec, maus-see-shot --window --clipboard

# Open the shell in the background at login, once mausd answers.
exec-once = maus-shell-open --background
